<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Portofolio</title>

</head>
<body class="bg-white text-gray-900 font-sans min-h-screen flex flex-col justify-between">

  
  <header class="bg-[#1e293b] text-white px-6 py-4 flex justify-between items-center text-sm">
    <span class="font-semibold text-base">Web kuuu</span>
    <nav class="space-x-4">
      <a href="#" class="hover:text-gray-300">home</a>
      <a href="#" class="hover:text-gray-300">about</a>
      <a href="#" class="hover:text-gray-300">contact</a>
    </nav>
  </header>

  <!-- Content / Konten Utama -->
  <main class="max-w-6xl mx-auto px-4 py-12 text-center flex-grow w-full">
    
    <!-- Hero Text -->
    <h1 class="text-3xl font-bold mb-2">Selamat Datang di  webb kuu</h1>
    <p class="text-gray-600 mb-10">Ini adalah halaman landing sederhana menggunakan Tailwind CSS.</p>

    <!-- 3 Kotak Fitur (Lebih Besar) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
      
      <!-- Kotak 1 -->
      <div class="border border-gray-200 rounded-xl p-10 min-h-[220px] flex flex-col justify-center shadow-sm hover:shadow-md transition">
        <h2 class="font-bold text-2xl mb-3">Fitur 1</h2>
        <p class="text-gray-600 text-base">Deskripsi singkat fitur 1.</p>
      </div>

      <!-- Kotak 2 -->
      <div class="border border-gray-200 rounded-xl p-10 min-h-[220px] flex flex-col justify-center shadow-sm hover:shadow-md transition">
        <h2 class="font-bold text-2xl mb-3">Fitur 2</h2>
        <p class="text-gray-600 text-base">Deskripsi singkat fitur 2.</p>
      </div>

      <!-- Kotak 3 -->
      <div class="border border-gray-200 rounded-xl p-10 min-h-[220px] flex flex-col justify-center shadow-sm hover:shadow-md transition">
        <h2 class="font-bold text-2xl mb-3">Fitur 3</h2>
        <p class="text-gray-600 text-base">Deskripsi singkat fitur 3.</p>
      </div>

    </div>

    <!-- Form Kontak -->
    <form class="max-w-lg mx-auto text-left space-y-4 mb-8">
      <input type="text" placeholder="Nama Lengkap" class="w-full p-3 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
      <textarea rows="4" placeholder="Pesan Anda..." class="w-full p-3 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required></textarea>
    </form>

  </main>

  <!-- Tombol Kirim Biru Selebar Layar -->
  <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 text-center transition">
    Kirim
  </button>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-gray-500 border-t">
    &copy; Mochammad Kevin Irwansyah. hak ciptakuu ini
  </footer>

</body>
</html>
